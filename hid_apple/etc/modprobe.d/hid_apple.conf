# Epomaker x Feker Galaxy80 (X80): in Mac mode it reports Apple's USB
# vendor id (05AC:024F), so the kernel hid_apple driver claims it and —
# with the default fnmode=3 ("auto", behaves like 1 for an Apple VID) —
# maps the top row to media keys, so F1-F12 never reach the OS.
#
# fnmode=2 makes F1-F12 the primary action (Fn for media instead).
#
# NOTE: this file is only read when hid_apple loads. Replugging the
# keyboard does NOT reload the module, so changing this needs a reboot
# (or `modprobe -r hid_apple && modprobe hid_apple`, awkward while it's
# the keyboard in use). install.sh also pokes the live sysfs value so it
# applies immediately. See install.sh.
options hid_apple fnmode=2
