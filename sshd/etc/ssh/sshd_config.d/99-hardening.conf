# SSH hardening drop-in. Loaded by /etc/ssh/sshd_config via
#   Include /etc/ssh/sshd_config.d/*.conf
# First match wins in sshd_config; the `99-` prefix puts this last
# alphabetically so it overrides earlier drop-ins.
#
# Effect:
#   - Key-only auth (passwords/keyboard-interactive disabled).
#   - Root cannot log in.
#   - No empty passwords (defence in depth; already implied by above).
#   - No X11 forwarding.
#
# Pre-flight before applying on a remote host: ensure ~/.ssh/authorized_keys
# has at least one valid pubkey, or you will lock yourself out.
#   chmod 700 ~/.ssh && chmod 600 ~/.ssh/authorized_keys

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
