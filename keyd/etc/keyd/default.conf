# Modifier normalisation (installed by keyd/install.sh — see it for why this
# lives in dotfiles instead of being stow-symlinked).
#
#   tap CapsLock      -> Ctrl    (home-row modifier; never toggles typed case)
#   Shift + CapsLock  -> real CapsLock toggle
#   bottom-left Ctrl  -> Menu    (keyboard-layout switch)
#
# Why CapsLock -> Ctrl: Ctrl is the shell's working modifier
# (Ctrl+A/E/U/K/W/Y/P/N plus fzf's Ctrl+T/Ctrl+R), and the stock Ctrl in the
# bottom-left corner drags the pinky off the home row every time. CapsLock is
# the only modifier position ON the home row. macOS can do this remap natively
# (System Settings -> Keyboard -> Modifier Keys), so the same physical layout
# reproduces on the work Mac with no software installed. See docs/keybinds.md.
#
# Why Shift+CapsLock and not Fn+CapsLock: a stock laptop Fn is handled in
# keyboard firmware and never reaches the OS, so no software (keyd, xkb,
# niri) can see "Fn+CapsLock". Shift+CapsLock is the deliberate way back to
# case-lock, and it stays that way because it is the portable answer — it
# holds on the Mac and on any keyboard whose Fn is still firmware-only.
# (On THIS machine Fn was since remapped to emit rightalt, which is what the
# [fnrow] layer at the end of this file is built on.)
#
# Why there is NO Super/Alt swap here, even though the two machines disagree:
# a stock PC bottom row is  Ctrl | Super | Alt | SPACE  and a stock Mac one is
# fn | Control | Option | Command | SPACE — counting outward from the space
# bar, Alt sits 1st on the PC but 2nd on the Mac.
#
# The fix goes on the MAC, not here. Reasons, in order of weight:
#   1. Alt carries the container layer (Alt+t, Alt+hjkl, Alt+Space) and is the
#      hottest modifier in the scheme, so it belongs directly under a resting
#      thumb — which is exactly where a stock PC layout already puts it.
#   2. Super+hjkl / Super+1..9 drive niri all day; moving Super is the single
#      most expensive change that could be made to this machine.
#   3. macOS remaps ALL of Control/Option/Command/CapsLock natively in
#      System Settings -> Keyboard -> Modifier Keys. The Mac is not the rigid
#      machine for modifier positions, so the earlier "push complexity to the
#      box with root" reasoning does not apply to this particular knob.
#
# Mac side (no software, per keyboard device):
#   Caps Lock -> Control     Command -> Option     Option -> Command
# which yields  fn | Control | Command | Option | SPACE  and lines both
# machines up: 1st from space = Alt, 2nd = Super/Command.
#
# NOTE: the former `capslock = f19` mapping is gone. <leader> in Neovim is
# now Space, which needs no keyd at all — the scheme survives on any
# keyboard, including the MacBook's built-in one.

[ids]
*

# Why the bottom-left Ctrl is repurposed: once CapsLock IS Ctrl, the corner
# key is dead weight, so it becomes the keyboard-layout switch — one key, no
# chord, nothing else on it.
#
# It cannot simply stay `leftcontrol` with xkb's grp:lctrl_toggle, because
# keyd makes CapsLock emit leftcontrol too and xkb cannot tell the two apart
# — every bare CapsLock tap would then flip the layout. Emitting a keycode
# nothing else uses removes the ambiguity.
#
# NOTE: xkb options are applied by the compositor when a keyboard is ADDED,
# not on config reload. `systemctl restart keyd` recreates keyd's virtual
# keyboard, which is exactly that event — so this script activates both
# halves at once.

[main]
capslock = layer(control)

# Target is the Menu key (keycode 135, xkb <COMP>) because it is not a
# modifier at all — holding it cannot accidentally behave like Ctrl or AltGr,
# and nothing else on either machine claims it. xkb turns it into
# ISO_Next_Group via `grp:menu_toggle` (see niri/config.kdl); Shift+Menu
# still produces a real Menu press.
leftcontrol = compose

# The physical Fn key reaches the OS as rightalt on this machine, so rightalt
# stops being AltGr and becomes the Fn row. See the [fnrow] block at the end.
rightalt = layer(fnrow)

[shift]
capslock = capslock

# ---------------------------------------------------------------------------
# Super+C / Super+V — copy and paste, everywhere, on the same physical key as
# Cmd+C / Cmd+V on the Mac. This is the one place where the two machines
# genuinely disagreed and the fix had to go on THIS side: macOS routes copy
# through Cmd in every application, Linux routes it through Ctrl, and Ctrl is
# spoken for here (it is the shell's editing modifier — see docs/keybinds.md).
#
# Why NOT `c = C-c`, the obvious mapping: in a terminal Ctrl+C is SIGINT.
# Rewritten at the evdev level it is indistinguishable from a real Ctrl+C, so
# every copy inside kitty would kill the foreground process instead. Same trap
# on the paste side: Ctrl+V is visual-block in vim.
#
# Insert is the way out. Linux has a second, older clipboard convention that
# GTK, Qt, Chromium and Firefox all still honour — Ctrl+Insert to copy,
# Shift+Insert to paste, Shift+Delete to cut — and it collides with nothing:
# neither Insert nor Shift+Delete carries meaning in fish, tmux or nvim. So the
# finger presses Super, the application receives the chord it already
# understands, and no terminal semantics move.
#
# NOT mapped, and the reason matters: Super+S. Save has no alternate chord, so
# it would have to become Ctrl+S — which in a terminal is XOFF and freezes the
# output stream until Ctrl+Q. Unlike Super+Z's suspend, that failure looks like
# a hang rather than an action, so it is left unmapped. kitty discards Super+S
# outright (see kitty.conf) to stop it leaking into tmux as a pane split.
#
# Cost, recorded so it is not rediscovered the hard way: kitty and VSCode now
# have to bind the Insert pair rather than Super, because keyd rewrites the
# keys below the compositor and neither program ever sees Super+C again.
#
# Why [meta] and not [meta:M]: keyd predefines meta as layer(meta) where meta
# IS meta:M, so the layer already exists and already emulates Super for every
# key not named here — Super+hjkl, Super+1..9 and the rest of niri's bindings
# are untouched. Re-declaring the modifier set would redefine that layer
# instead of extending it. And per keyd's own rule, bindings are not affected
# by the modifiers of the layer holding them: Super is stripped from the
# output, so applications see a clean Ctrl+Insert, not Super+Ctrl+Insert.
# ---------------------------------------------------------------------------
#
# Super+A and Super+Z are the odd ones out: select-all and undo have no second
# convention the way the clipboard has Insert, so they map straight onto Ctrl+A
# and Ctrl+Z. Redo comes free — a binding does not inherit its layer's
# modifiers, so Super+Shift+Z emits Shift+Ctrl+Z.
#
# Super+A is cheap. Nothing on the path claims Ctrl+A destructively: tmux runs
# on its default C-b prefix, and nvim already rebinds <C-a> to ggVG, which IS
# select all. In fish it lands on the preset's beginning-of-line — a command
# line has no select-all to collide with, so nothing is lost.
#
# Super+Z is NOT cheap, and this is deliberate rather than overlooked. In a
# terminal Ctrl+Z is SIGTSTP, so Super+Z there suspends the foreground job
# instead of undoing (recover with `fg`). There is no way around it: keyd
# rewrites below the compositor and cannot tell a terminal from a browser, and
# unlike copy there is no alternate undo chord to route through. Accepted
# because undo in a shell is not a thing, while undo in a browser is constant.
#
# Super+arrows are the other half of the Mac's caret vocabulary: Cmd+Left/Right
# go to the ends of the LINE, Cmd+Up/Down to the ends of the document. Home,
# End, Ctrl+Home and Ctrl+End are what every Linux program already calls those,
# so the translation is exact and needs nothing downstream: fish's preset has
# home/end on beginning-of-line/end-of-line, nvim's Home/End/C-Home/C-End are
# builtin 0/$/gg/G, VSCode agrees, and tmux binds none of them.
#
# This also plugs a leak. niri claims no Mod+arrow, so before this the chord
# fell through to kitty, and tmux — which has no Super in its grammar — folded
# it into Meta, handing fish Alt+Left. Word motion, from the wrong modifier,
# silently. Same defect that made Super+S split a pane (see kitty.conf).
#
# niri's own Mod+Home / Mod+Ctrl+Home are untouched: Super is stripped from the
# output here, so niri sees a bare Home and never matches its Mod+ bindings.
[meta]
c = C-insert
v = S-insert
x = S-delete
a = C-a
z = C-z
left = home
right = end
up = C-home
down = C-end

# ---------------------------------------------------------------------------
# Alt+Left / Alt+Right — move by word, the way macOS does it in every text
# field. Linux uses Ctrl+arrows for the same thing, so the chord is translated
# here instead of being taught twice.
#
# Nothing on the path loses anything: fish's preset has ctrl-left/ctrl-right on
# backward-token/forward-token, nvim's <C-Left>/<C-Right> are vim's own b and
# w, VSCode on Linux puts cursorWordLeft/Right there, and GTK/Qt/browsers use
# Ctrl+arrows natively. tmux and niri bind no arrow chords at all.
#
# Selection comes free. Per keyd's rule that a binding does not inherit its
# layer's modifiers, Alt+Shift+Left emits Shift+Ctrl+Left — select-by-word,
# exactly as Option+Shift+Left does on the Mac.
#
# Only Left/Right. Alt+Up/Down stays untouched because VSCode uses it to move
# a line up and down on BOTH machines, which is worth more than paragraph
# motion. Alt+Backspace is untouched for a harder reason: fish's preset binds
# alt-backspace to backward-kill-word but has NO ctrl-backspace binding, so
# translating it would delete the feature rather than move it.
#
# Cost: VSCode's Linux-only "Go Back" on Alt+Left is no longer reachable by
# that key. It is Ctrl+- on macOS anyway, so the two machines were never in
# step on it to begin with.
#
# leftalt only — keyd binds rightalt to layer(altgr), which this does not touch.
# ---------------------------------------------------------------------------
[alt]
left = C-left
right = C-right

# ---------------------------------------------------------------------------
# The Fn row — rightalt IS the Fn layer.
#
# The physical Fn key on this machine no longer acts as firmware Fn: it
# arrives as a plain `rightalt` press (verified with `keyd monitor`). That
# takes every hardware F-row function down with it — mute, volume, mic mute,
# brightness were all produced by the firmware Fn and never existed as
# keycodes Linux could bind. This layer puts them back in software.
#
# Why a plain layer and not keyd's built-in `layer(altgr)` that rightalt
# normally holds: altgr is a MODIFIER layer, so every key it does not name
# still emits AltGr+key downstream. AltGr carries nothing here (us + ru, no
# third level), so the whole layer goes to the Fn row and undefined keys fall
# through clean — Fn+j is j, not AltGr+j.
#
# The mappings reproduce the legends printed on the X280 F-row, so the finger
# follows the icon on the key rather than a second scheme. niri already binds
# the audio and brightness XF86 keys with allow-when-locked=true (see the
# "volume keys" / "brightness key" blocks in niri/config.kdl), so F1-F6 work
# on the lock screen too and need nothing added there.
#
# F7-F12 emit the correct keysyms but niri claims none of them yet, so they
# are inert until something does:
#   f7  switchvideomode -> XF86Display     (external display legend)
#   f8  wlan            -> XF86WLAN        (airplane mode legend)
#   f9  config          -> XF86Tools       (gear/settings legend)
#   f10 bluetooth       -> XF86Bluetooth
#   f12 favorites       -> XF86Favorites   (star legend)
# F11's "keyboard settings" legend has no evdev code at all, so it is left
# undefined and falls through to a plain F11.
# ---------------------------------------------------------------------------
[fnrow]
f1 = mute
f2 = volumedown
f3 = volumeup
f4 = micmute
f5 = brightnessdown
f6 = brightnessup
f7 = switchvideomode
f8 = wlan
f9 = config
f10 = bluetooth
f12 = favorites
