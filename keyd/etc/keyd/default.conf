# CapsLock remap (installed by keyd/install.sh — see it for why this lives
# in dotfiles instead of being stow-symlinked).
#
#   tap CapsLock      -> F19   (Neovim <leader>; never toggles typed case)
#   Shift + CapsLock  -> real CapsLock toggle
#
# Why Shift+CapsLock and not Fn+CapsLock: on laptops the Fn key is handled
# in keyboard firmware and never reaches the OS, so no software (keyd, xkb,
# niri) can ever see "Fn+CapsLock". Shift+CapsLock is the deliberate way
# back to case-lock.
#
# Why F19 and NOT F13 (don't relearn this the hard way): keyd emits raw
# Linux keycodes; xkb then assigns the keysym. In the default `us` keymap
# the F13-F24 keycodes are bound to vendor keysyms terminals silently drop
# (KEY_F13 -> XF86Tools, F14-F18/F20-F24 -> XF86Launch*/XF86Touchpad*...).
# KEY_F19 is the ONE keycode that maps to a clean `F19` keysym, so it is
# the only choice that actually reaches kitty -> tmux -> nvim.
#
# keyd sits below xkb: the emitted F19 flows through niri/libxkbcommon to
# the focused app, and the emitted `capslock` still hits xkb's default
# Caps_Lock toggle.

[ids]
*

[main]
capslock = f19

[shift]
capslock = capslock
