# Modifier normalisation (installed by keyd/install.sh — see it for why this
# lives in dotfiles instead of being stow-symlinked).
#
#   tap CapsLock      -> Ctrl    (home-row modifier; never toggles typed case)
#   Shift + CapsLock  -> real CapsLock toggle
#   bottom-left Ctrl  -> Menu    (keyboard-layout switch)
#
# Why CapsLock -> Ctrl: Ctrl is the shell's working modifier
# (Ctrl+A/E/U/K/W/Y/P/N plus fzf's Ctrl+T/Ctrl+R), and the stock Ctrl in the
# bottom-left corner drags the pinky off the home row every time. CapsLock is
# the only modifier position ON the home row. macOS can do this remap natively
# (System Settings -> Keyboard -> Modifier Keys), so the same physical layout
# reproduces on the work Mac with no software installed. See docs/keybinds.md.
#
# Why Shift+CapsLock and not Fn+CapsLock: on laptops the Fn key is handled
# in keyboard firmware and never reaches the OS, so no software (keyd, xkb,
# niri) can ever see "Fn+CapsLock". Shift+CapsLock is the deliberate way
# back to case-lock.
#
# Why there is NO Super/Alt swap here, even though the two machines disagree:
# a stock PC bottom row is  Ctrl | Super | Alt | SPACE  and a stock Mac one is
# fn | Control | Option | Command | SPACE — counting outward from the space
# bar, Alt sits 1st on the PC but 2nd on the Mac.
#
# The fix goes on the MAC, not here. Reasons, in order of weight:
#   1. Alt carries the container layer (Alt+t, Alt+hjkl, Alt+Space) and is the
#      hottest modifier in the scheme, so it belongs directly under a resting
#      thumb — which is exactly where a stock PC layout already puts it.
#   2. Super+hjkl / Super+1..9 drive niri all day; moving Super is the single
#      most expensive change that could be made to this machine.
#   3. macOS remaps ALL of Control/Option/Command/CapsLock natively in
#      System Settings -> Keyboard -> Modifier Keys. The Mac is not the rigid
#      machine for modifier positions, so the earlier "push complexity to the
#      box with root" reasoning does not apply to this particular knob.
#
# Mac side (no software, per keyboard device):
#   Caps Lock -> Control     Command -> Option     Option -> Command
# which yields  fn | Control | Command | Option | SPACE  and lines both
# machines up: 1st from space = Alt, 2nd = Super/Command.
#
# NOTE: the former `capslock = f19` mapping is gone. <leader> in Neovim is
# now Space, which needs no keyd at all — the scheme survives on any
# keyboard, including the MacBook's built-in one.

[ids]
*

# Why the bottom-left Ctrl is repurposed: once CapsLock IS Ctrl, the corner
# key is dead weight, so it becomes the keyboard-layout switch — one key, no
# chord, nothing else on it.
#
# It cannot simply stay `leftcontrol` with xkb's grp:lctrl_toggle, because
# keyd makes CapsLock emit leftcontrol too and xkb cannot tell the two apart
# — every bare CapsLock tap would then flip the layout. Emitting a keycode
# nothing else uses removes the ambiguity.
#
# NOTE: xkb options are applied by the compositor when a keyboard is ADDED,
# not on config reload. `systemctl restart keyd` recreates keyd's virtual
# keyboard, which is exactly that event — so this script activates both
# halves at once.

[main]
capslock = layer(control)

# Target is the Menu key (keycode 135, xkb <COMP>) because it is not a
# modifier at all — holding it cannot accidentally behave like Ctrl or AltGr,
# and nothing else on either machine claims it. xkb turns it into
# ISO_Next_Group via `grp:menu_toggle` (see niri/config.kdl); Shift+Menu
# still produces a real Menu press.
leftcontrol = compose

[shift]
capslock = capslock
