font_family Terminess Nerd Font Mono
bold_font auto
italic_font family="Terminus Italic"
bold_italic_font family="Terminus Italic" style="Bold Italic"
font_size 12.0
disable_ligatures always
symbol_map U+3000-U+9FFF,U+F900-U+FAFF Unifont

cursor_shape block
cursor_blink_interval 2
cursor_stop_blinking_after 15.0
cursor_trail 5
cursor_trail_start_threshold 0
cursor_trail_decay 0.1 0.1

scrollback_lines 10000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

mouse_hide_wait 3.0
url_color #4385BE
url_style curly
open_url_with default
click_interval -1.0

remember_window_size yes
initial_window_width 640
initial_window_height 400
window_resize_step_cells 2
window_resize_step_lines 2
window_border_width 0.5pt
window_padding_width 6
active_border_color #8B7EC8
inactive_border_color #403E3C
bell_border_color #CECDC3

tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_switch_strategy previous
tab_fade 0.25 0.5 0.75 1
tab_separator " ┇"
tab_title_template "{title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}"
active_tab_foreground #100F0F
active_tab_background #8B7EC8
active_tab_font_style normal
inactive_tab_foreground #878580
inactive_tab_background #1C1B1A
inactive_tab_font_style normal

cursor #8B7EC8
background #100F0F
foreground #CECDC3
selection_background #8B7EC8
selection_foreground #100F0F

# Flexoki Dark — see ~/celestia/PALETTE.md
color0  #100F0F
color1  #D14D41
color2  #879A39
color3  #D0A215
color4  #4385BE
color5  #CE5D97
color6  #3AA99F
color7  #CECDC3
color8  #575653
color9  #E8705F
color10 #A0AF54
color11 #DFB431
color12 #66A0C8
color13 #E47DA8
color14 #5ABDAC
color15 #FFFCF0
kitty_mod ctrl+shift

# Copy/paste. The finger presses Super+C / Super+V — the same physical key as
# Cmd+C / Cmd+V on the Mac — but kitty never sees Super: keyd rewrites the pair
# below the compositor into Ctrl+Insert / Shift+Insert (keyd/etc/keyd/default.conf
# explains why Insert and not Ctrl+C: Ctrl+C here is SIGINT and cannot move).
# So these two lines ARE the Super binds; there is no `map super+c` any more.
#
# Free bonus: Insert is not a letter, so the Cyrillic duplicates that every
# other binding in this file needs are unnecessary here. keyd matches physical
# keycodes, so Super+С on the JCUKEN layout is the same keypress as Super+C.
#
# copy_or_noop, not copy_to_clipboard: kitty's own selection only exists when
# the mouse made it, and under tmux the mouse belongs to tmux — so a plain
# copy_to_clipboard would copy an empty selection and swallow the key. The
# _or_noop variant copies when kitty has a selection and otherwise PASSES THE
# KEY THROUGH to the program, which is what lets the same Super+C also reach
# tmux copy-mode (tmux.conf) and nvim (init.lua). One key, three layers.
map ctrl+insert copy_or_noop
map shift+insert paste_from_clipboard

# Swallow the Super chords niri does not claim, or they turn into Alt chords
# inside tmux.
#
# tmux has no Super in its grammar — only C-, M- and S- — and when a key
# arrives carrying the Super bit it folds it into Meta. Verified by feeding a
# raw \x1b[115;9u (Super+s) to a tmux server: it ran split-window. `M-s` is
# tmux's vertical split, so Super+S was splitting panes. Setting
# extended-keys on/always changes nothing; the fold happens either way.
#
# Every Super chord niri binds is consumed by niri and never reaches here, so
# only the gaps leak. These are exactly the keys where niri has no Mod+<key>
# while tmux.conf has a root-table M-<key>:
#   s split · n/p next/prev window · u copy-mode · / search · ` · Shift+q kill
# Absent on purpose: c, v, a, z and the arrows — keyd rewrites all of those
# into ordinary chords before kitty ever sees a Super, so there is nothing left
# to leak. tmux's M-z (zoom) is covered that way rather than here.
#
# discard_event, not no_op: no_op UNBINDS, which sends the key on to the
# program — precisely the bug. discard_event drops the event entirely.
#
# --allow-fallback=shifted,ascii adds physical-position fallback for non-Latin
# layouts, so one line covers both `s` and JCUKEN's `ы` on the same key. It is
# what kitty's own default shortcuts use.
map --allow-fallback=shifted,ascii super+s discard_event
map --allow-fallback=shifted,ascii super+n discard_event
map --allow-fallback=shifted,ascii super+p discard_event
map --allow-fallback=shifted,ascii super+u discard_event
map --allow-fallback=shifted,ascii super+/ discard_event
map --allow-fallback=shifted,ascii super+` discard_event
map --allow-fallback=shifted,ascii super+shift+q discard_event

# kitty_mod versions kept: they still work over ssh into a machine where
# neither keyd nor super arrives, and they are what every kitty doc/example
# shows.
map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard
# Primary selection (middle-click buffer) keeps its own key — Shift+Insert used
# to paste it, and now that Shift+Insert is the clipboard, kitty_mod+s is the
# only way left to reach it.
map kitty_mod+s paste_from_selection
map kitty_mod+o pass_selection_to_program
# Russian (JCUKEN) duplicates: same physical keys with Cyrillic layout
map kitty_mod+с copy_to_clipboard
map kitty_mod+м paste_from_clipboard
map kitty_mod+ы paste_from_selection
map kitty_mod+щ pass_selection_to_program

map kitty_mod+up scroll_line_up
map kitty_mod+k scroll_line_up
map kitty_mod+down scroll_line_down
map kitty_mod+j scroll_line_down
map kitty_mod+page_up scroll_page_up
map kitty_mod+page_down scroll_page_down
map kitty_mod+home scroll_home
map kitty_mod+end scroll_end
map kitty_mod+h show_scrollback
map kitty_mod+л scroll_line_up
map kitty_mod+о scroll_line_down
map kitty_mod+р show_scrollback

enable_audio_bell no
window_alert_on_bell yes
bell_on_tab yes
# Auto-attach to tmux, return to shell on detach
shell fish -c 'tmux new-session -A -s main; exec fish'
editor nvim
update_check_interval 0
clipboard_control write-clipboard write-primary
confirm_os_window_close 0
