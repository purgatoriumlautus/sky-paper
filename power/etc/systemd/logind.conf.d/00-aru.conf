# laniakea (ThinkPad X280) — lid + sleep policy.
# Drop-in for /etc/systemd/logind.conf.d/, parsed after logind.conf and
# overrides it. Keep this file minimal: only deltas vs systemd defaults.

[Login]
# `sleep` — NOT `suspend`. Only the `sleep` handle action consults
# SleepOperation= below; HandleLidSwitch=suspend (the systemd default) goes
# straight to plain S3 and never reaches suspend-then-hibernate. That was the
# bug: SleepOperation= and sleep.conf's HibernateDelaySec= were both live in
# config and both dead in practice, so a closed laptop sat in S3 until flat.
HandleLidSwitch=sleep
HandleLidSwitchExternalPower=sleep

# Docked (external display connected) → do nothing on lid close, so the
# clamshell-with-monitor case keeps working.
HandleLidSwitchDocked=ignore

# First supported operation wins. suspend-then-hibernate = S3 now, hibernate
# after sleep.conf.d's HibernateDelaySec. `suspend` is the fallback if
# hibernation is unavailable (no resume=, swap too small), so a firmware or
# partition change degrades to plain S3 instead of leaving the lid dead.
SleepOperation=suspend-then-hibernate suspend
