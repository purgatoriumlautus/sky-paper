# laniakea (ThinkPad X280) — suspend/hibernate mechanics.
# Drop-in for /etc/systemd/sleep.conf.d/, parsed after sleep.conf.

[Sleep]
# S3 for 30 min, then hibernate. Bounds bag-drain: a forgotten laptop lands
# in hibernate (~0 W) instead of bleeding ~0.5-1 %/h in S3 until flat, which
# leaves the pack sitting at low SoC — its own Li-ion degradation path.
# Only consulted via suspend-then-hibernate (see logind.conf.d/00-aru.conf).
HibernateDelaySec=1800

# Force real S3 for the suspend leg, not s2idle. The X280 firmware already
# offers `deep` (BIOS Sleep State = Linux), so this is belt-and-braces: it
# survives a CMOS clear or a BIOS update that reverts to Windows/S0ix
# defaults, where s2idle would silently let the machine idle-tick warm in a
# closed bag. MemorySleepMode is written to /sys/power/mem_sleep at suspend
# time and only applies when SuspendState=mem.
SuspendState=mem
MemorySleepMode=deep
