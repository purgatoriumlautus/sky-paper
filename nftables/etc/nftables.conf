#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:
#
# Entry point. Real rules live in /etc/nftables.d/*.nft so the firewall
# is composable (one file per concern: base, services, vm bridge...).
#
# Validate before applying: sudo nft -c -f /etc/nftables.conf
# Apply:                    sudo systemctl reload nftables

include "/etc/nftables.d/*.nft"
