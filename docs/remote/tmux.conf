# tmux for the corporate Ubuntu box — copy to ~/.config/tmux/tmux.conf
#   (tmux < 3.1 reads ~/.tmux.conf instead; jammy ships 3.2a, so the XDG path
#    is fine — check with `tmux -V` if in doubt)
#
# This is NOT celestia's tmux.conf and must not be replaced by it. Different
# job, therefore different config.
#
# On celestia tmux is the window manager of the terminal: Alt+hjkl walks panes,
# Alt+1..9 selects windows, Alt+v/s splits. None of that can work here, and not
# because of tmux. Inside VSCode the keystroke never gets that far — VSCode
# consumes everything listed in commandsToSkipShell (docs/vscode/settings.json)
# before the bytes reach the terminal, and the whole Alt tier is in that list
# because VSCode itself moves on those keys. Panes and windows are already
# provided, one layer up.
#
# So tmux keeps exactly one job here: THE SESSION SURVIVES. Close VSCode, drop
# the VPN, reboot the laptop — the shell and whatever is running in it are
# still there. That is the failure this config exists to prevent.
#
# Practical consequence: you will almost never press the prefix. Attach, work,
# close the lid. Detaching happens on its own when the client dies.

# ---------------------------------------------------------------------------
# Which shell panes get
# ---------------------------------------------------------------------------
# tmux does NOT inherit the shell you were using when you typed `tmux`. It uses
# default-shell, which falls back to $SHELL as it was when the tmux SERVER
# started, and failing that to the /etc/passwd entry. So on a box where the
# login shell is still bash, every pane is bash — and fish's config is not
# "being ignored", it is simply never loaded.
#
# Setting it explicitly makes this independent of chsh and of which shell
# happened to launch the server. The if-shell guard means a box without fish
# still gets working panes instead of a server that refuses to start.
#
# Changing this affects new panes only, and reloading the config is NOT enough:
# `prefix r` sets the option but every existing pane keeps the shell it was
# born with. The only way to see the change is `tmux kill-server` (detach or
# finish anything running first) and start a fresh session.
#
# Set directly rather than wrapped in `if-shell '[ -x ... ]'`. The guard reads
# as defensive but costs more than it saves: if the path is ever wrong, the
# guard makes tmux silently fall back to bash and the cause is invisible, while
# a bare set fails loudly at the first pane. Loud beats silent here — on a box
# where the path is known, there is nothing to guard against.
set -g default-shell /usr/bin/fish

# Do NOT chsh the login shell to fish on this box. Learned the hard way: VSCode
# Remote-SSH logs in and then pipes a POSIX bootstrap script into the login
# shell, expecting markers ($PLATFORM, a port) back. fish cannot parse that
# syntax, so nothing is echoed and the connection hangs until it times out —
# the give-away in the Remote-SSH log is
#   WARN: $PLATFORM is undefined in installation script output
# arriving right after a successful "Authenticated ... using publickey".
#
# Keep the login shell POSIX (`chsh -s /usr/bin/bash`) and reach fish the two
# ways that do not involve login: this default-shell line for tmux panes, and
# terminal.integrated.defaultProfile.linux = "fish" for VSCode's terminals.

# ---------------------------------------------------------------------------
# Terminal capabilities
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
# celestia declares RGB for xterm-kitty; here the outer terminal is VSCode's,
# which reports xterm-256color.
set -as terminal-features ",xterm-256color:RGB"

# Let programs emit their own escape sequences through tmux to the real
# terminal — needed for anything that talks to the emulator directly.
#
# Guarded by version: allow-passthrough arrived in tmux 3.3, and jammy ships
# 3.2a, where an unguarded `set` aborts config parsing at that line with
# "invalid option" — taking every setting BELOW it down with the error.
#
# Nothing here depends on it today: the clipboard path is set-clipboard plus
# fish writing OSC 52 straight to the client tty. It is kept so the file still
# does the right thing on a newer box without being edited.
if-shell '! tmux -V | grep -qE "^tmux (1\.|2\.|3\.[0-2])"' 'set -g allow-passthrough on'

# ---------------------------------------------------------------------------
# Clipboard — the one setting that is load-bearing on a headless box
# ---------------------------------------------------------------------------
# There is no wl-copy and no xclip here, so copying can only work by asking
# the terminal at the FAR end to do it: OSC 52, base64 in the body, VSCode on
# the Mac turns it into a real clipboard write.
#
# `set-clipboard on` is what makes tmux emit that sequence itself when text is
# copied, and also what lets a program inside a pane emit one and have tmux
# forward it instead of swallowing it. Without this line, copy silently ends
# at the tmux buffer and never reaches the Mac.
#
# fish's Ctrl+X does not depend on this — fish_clipboard_copy detects TMUX and
# writes to the client tty directly, bypassing tmux entirely.
set -g set-clipboard on

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
set -g mouse on
set -s escape-time 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# Bigger than celestia's 2000: this is where build and deploy output lives, and
# scrollback is the only reason to open copy-mode here at all.
set -g history-limit 50000

# The prefix stays C-b, same as celestia — deliberately not "improved" into a
# second dialect to remember. It does shadow fish's backward-char; if that ever
# annoys you, one line moves it (`set -g prefix C-o` + `bind C-o send-prefix`),
# but C-o has to stay clear of the Ctrl tier in docs/keybinds.md first.

# ---------------------------------------------------------------------------
# Copy-mode — vi keys, same vocabulary as celestia and nvim
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
# copy-selection-and-cancel, NOT copy-pipe: there is no clipboard command to
# pipe into. With set-clipboard on, tmux emits the OSC 52 itself.
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# Drag-select with the mouse copies on release, same as celestia.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Status bar — session name, window list, host. Flexoki Dark.
# ---------------------------------------------------------------------------
# Deliberately minimal: the point is knowing WHICH session you reattached to.
set -g status-style "bg=default,fg=colour246"
set -g status-left  "#[fg=colour140,bold] #S #[default]"
set -g status-right "#[fg=colour246] #h "
set -g status-left-length 30
setw -g window-status-current-style "fg=colour140,bold"
set -g pane-active-border-style "fg=colour140"
set -g pane-border-style "fg=colour238"

# ---------------------------------------------------------------------------
# Reload
# ---------------------------------------------------------------------------
# Alt+r is celestia's key for this, but Alt never arrives here — so it lives on
# the prefix, which is the one modifier VSCode does pass through.
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
