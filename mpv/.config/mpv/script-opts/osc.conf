# mpv built-in OSC — Sky Paper. Stock layout (bottombar), palette colors, text in
# Terminess via osd-font (set in mpv.conf). NOTE: no inline comments; colors #RRGGBB.

# stock felt oversized at 1080p — a gentle scale down
scalewindowed=0.8
scalefullscreen=0.8
# lift the bar off the screen edge so fullscreen doesn't clip the bottom row
barmargin=20

# palette
background_color=#E4DED0
timecode_color=#4A6F8E
title_color=#1F1812
buttons_color=#1F1812
top_buttons_color=#1F1812
time_pos_color=#1F1812
time_pos_outline_color=#F0EBE0
