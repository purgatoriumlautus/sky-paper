# mpv built-in OSC — Flexoki Dark. Stock layout (bottombar), palette colors, text in
# Terminess via osd-font (set in mpv.conf). NOTE: no inline comments; colors #RRGGBB.

# stock felt oversized at 1080p — a gentle scale down
scalewindowed=0.8
scalefullscreen=0.8
# lift the bar off the screen edge so fullscreen doesn't clip the bottom row
barmargin=20

# palette
background_color=#1C1B1A
timecode_color=#8B7EC8
title_color=#CECDC3
buttons_color=#CECDC3
top_buttons_color=#CECDC3
time_pos_color=#CECDC3
time_pos_outline_color=#100F0F
