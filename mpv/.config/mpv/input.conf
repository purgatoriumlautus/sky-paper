# mpv keybinds — the scheme's shared vim vocabulary (docs/keybinds.md).
#
# Stock mpv is not vim: seeking lives on the arrow keys, `j` cycles subtitles,
# `l` sets an A-B loop, `/` lowers the volume. Everything else in the setup —
# nvim, yazi, zathura, the browser — moves on hjkl, so the player does too.
#
# Only the keys named here change. Untouched stock binds that already agree
# with the scheme: SPACE and p pause, f fullscreen, q quit, m mute,
# s screenshot, [ ] playback speed, , . frame step, arrow keys.

# Horizontal = time. Lowercase is the small step, Shift the large one,
# the same relationship Shift has everywhere else in the scheme.
h seek -5
l seek  5
H seek -60
L seek  60

# Vertical = volume. Stock puts this on 9/0, which is a reach; j/k is where
# the fingers already are, and mpv's default j (subtitle cycle) moves to J.
j add volume -2
k add volume  2
J cycle sub
K cycle audio

# Start and end of file. mpv has no multi-key sequences, so this is a single
# `g` rather than vim's `gg`.
g seek 0 absolute
G seek 100 absolute-percent

# `/` is search everywhere else in the scheme and means nothing in a player.
# Stock mpv drops the volume with it — silence it rather than surprise.
/ ignore

# ── JCUKEN duplicates ───────────────────────────────────────────────────
# mpv has no langmap either; without these the player is dead in a Cyrillic
# layout, `q` included.
р seek -5
д seek  5
Р seek -60
Д seek  60
о add volume -2
л add volume  2
О cycle sub
Л cycle audio
п seek 0 absolute
П seek 100 absolute-percent
а cycle fullscreen
й quit
ь cycle mute
ы screenshot
з cycle pause
