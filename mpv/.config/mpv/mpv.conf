# mpv — Flexoki Dark. Night-paper window, palette-matched OSD.
# Palette: ~/dotfiles/PALETTE.md. Control bar + smooth animation: script-opts/osc.conf.
# NOTE: mpv.conf does NOT support trailing inline comments — keep every comment on
# its own line. Quote '#' color values or '#' starts a comment. Colors here = #AARRGGBB.

# Window: flat, no WM frame
border=no
# near-black paper behind audio-only files + letterbox bars
background-color='#FF100F0F'
border-background=color
# audio-only files still open a real, themed window; hold the last frame at EOF
force-window=yes
keep-open=yes
cursor-autohide=1000

# OSD text (seek / volume / messages): fg text, thin dark outline for any video
osd-font='Terminess Nerd Font Mono'
osd-font-size=30
osd-color='#FFCECDC3'
osd-outline-color='#FF100F0F'
osd-outline-size=1
osd-bar-align-y=0.85
