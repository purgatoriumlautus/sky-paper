# mpv — Sky Paper. Paper-cream window, palette-matched OSD.
# Palette: ~/celestia/PALETTE.md. Control bar + smooth animation: script-opts/osc.conf.
# NOTE: mpv.conf does NOT support trailing inline comments — keep every comment on
# its own line. Quote '#' color values or '#' starts a comment. Colors here = #AARRGGBB.

# Window: flat, no WM frame
border=no
# paper cream behind audio-only files + letterbox bars
background-color='#FFF0EBE0'
border-background=color
# audio-only files still open a real, themed window; hold the last frame at EOF
force-window=yes
keep-open=yes
cursor-autohide=1000

# OSD text (seek / volume / messages): fg text, thin cream outline for any video
osd-font='Terminess Nerd Font Mono'
osd-font-size=30
osd-color='#FF1F1812'
osd-outline-color='#FFF0EBE0'
osd-outline-size=1
osd-bar-align-y=0.85
