<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Terminess is a TTF tracing of the Terminus bitmap font.
       It only looks crisp at its native pixel sizes (12/14/16/18/20/22/24/
       28/32) with AA + hinting OFF. At any OTHER size, AA-off renders broken
       glyphs (half-drawn letters, jagged edges) — exactly what happens in
       apps like Obsidian that use arbitrary sizes + zoom.

       So: disable AA/hinting ONLY at the native pixel sizes (bar/greeter,
       which request these exactly). Every other size keeps the system
       default of AA ON, so Terminess stays smooth where it isn't pixel-perfect.

       One match block per native size — <test>s within a block are AND'd,
       so OR-ing sizes needs separate blocks. -->

  <match target="font">
    <test name="family" compare="contains"><string>Terminess</string></test>
    <test name="pixelsize" compare="eq"><double>12</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="autohint"  mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <match target="font">
    <test name="family" compare="contains"><string>Terminess</string></test>
    <test name="pixelsize" compare="eq"><double>14</double></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting"   mode="assign"><bool>false</bool></edit>
    <edit name="autohint"  mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>true</bool></edit>
  </match>

  <match target="font">
    <test name="family" compare="contains"><string>Terminess</string></test>
    <test name="pixelsize" compare="eq"><double>16</double></test>
