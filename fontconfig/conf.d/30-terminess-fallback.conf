<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Glyphs missing from Terminess (CJK, niche Unicode) fall back to Unifont.
       Append at pattern time so single-family configs (qs Theme.qml etc) get
       the safety net without listing families per-call. -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Terminess</string>
    </test>
    <edit name="family" mode="append">
      <string>Unifont</string>
    </edit>
  </match>
</fontconfig>
