<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Obsidian-only fontconfig, loaded via FONTCONFIG_FILE from the
       ~/.local/share/applications/obsidian.desktop override.

       Why this exists: Obsidian's UI is set to Terminess, but it renders
       text at arbitrary CSS sizes + zoom that never land on Terminess's
       native pixel grid (12/14/16/…). The global 20-terminess-bitmap.conf
       disables AA/hinting at those native sizes for the bar/greeter — and
       Obsidian's base 16px hits exactly that, so its body text came out as
       broken half-drawn bitmap glyphs.

       Fix: inherit the full system+user config, then force AA/hinting back
       ON for Terminess at ALL sizes and drop embedded bitmaps, so Obsidian
       always gets the smooth outline. The bar/greeter use the normal config
       (no FONTCONFIG_FILE) and stay pixel-crisp. -->

  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

  <match target="font">
    <test name="family" compare="contains"><string>Terminess</string></test>
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="hinting"        mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintslight</const></edit>
    <edit name="autohint"       mode="assign"><bool>false</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
