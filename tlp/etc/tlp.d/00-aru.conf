# laniakea (ThinkPad X280) — TLP overrides.
# Drop-in for /etc/tlp.d/, loaded after /etc/tlp.conf and overrides it.
# Keep this file minimal: only deltas vs TLP defaults.
#
# ThinkPad-native charge thresholds via natacpi (thinkpad_acpi). 85/90 is
# the "mild protection" pair — keeps ~40 Wh of the 44.46 Wh design capacity
# usable while avoiding the 100 % float-charge that visibly aged the original
# pack (90.3 % capacity at 64 cycles, then a latched protection IC).
#
# Current pack: aftermarket Cellonic, presents as 01AV470 / LGC, 44.46 Wh
# design, installed 2026-07 at 0 cycles. Calibrated 2026-08-02 by a full
# run-down to cutoff followed by a recharge: energy_full settled at 45.80 Wh,
# above design, so the gauge has run a real learning cycle and the figure is
# now a genuine health reading rather than an echo of energy_full_design.
# The EC honours the thresholds on it: verify with the spot-check in
# install.sh, and re-verify after any BIOS/EC update, since threshold support
# on a non-Lenovo pack is not guaranteed across firmware.
START_CHARGE_THRESH_BAT0=85
STOP_CHARGE_THRESH_BAT0=90
