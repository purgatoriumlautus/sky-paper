# Kernel + network hardening. Complements nftables (which filters packets);
# these knobs change how the kernel itself reacts to packets and exposes info.
# See: https://wiki.archlinux.org/title/Security#Kernel_hardening

# Hide kernel pointers from non-root (defeats KASLR-bypass via /proc/kallsyms)
kernel.kptr_restrict = 1

# Reverse path filtering - drop packets with spoofed source IPs
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects - a malicious peer on the LAN can't rewrite our routes
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Don't emit ICMP redirects either (only routers should)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# SYN-cookie fallback under SYN-flood (usually default, making it explicit)
net.ipv4.tcp_syncookies = 1

# IP forwarding ON — celestia runs Docker, whose bridge networking needs it.
# (libvirt routed mode would need it too.)
net.ipv4.ip_forward = 1
