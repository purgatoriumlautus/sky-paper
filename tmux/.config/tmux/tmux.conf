unbind-key -a -T root

# True color (24-bit). kitty supports it, but tmux must be told explicitly;
# without this, hex theme colors and the copy-mode selection highlight
# (mode-style) degrade and the visual selection is invisible.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Let programs talk to kitty directly (wrapped in tmux's own passthrough
# escape). Without it tmux swallows the capability query yazi sends at
# startup and yazi dies on "Terminal response timeout". "on" (visible pane
# only) is enough; "all" would also let background panes draw over the
# screen.
set -g allow-passthrough on

# Is the focused pane running nvim? Used to decide whether a container bind
# belongs to nvim or to tmux — see "Alt = containers" below.
# Zero forks: tmux already knows the pane's foreground command, so the check
# is a format, not a shell pipeline. The old probe shelled out to `ps | grep`
# on EVERY Alt+hjkl press — measured 45 ms per keypress, on the hottest bind
# of the whole scheme. Consumers use `if -F`, not `if-shell`.
#
# Caveat: pane_current_command names the foreground process, so nvim started
# under a wrapper (`sudo nvim`, nvim over `ssh`) reads as sudo/ssh and the key
# goes to tmux instead of into nvim. Not a case this scheme uses today.
is_vim="#{m/r:^g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}}"

# copy-mode = scrollback only. Copying a *command line* is Ctrl+X in fish,
# which takes the commandline buffer instead of screen cells (no `λ ` prompt,
# no padding, no right-prompt clock). See docs/keybinds.md.
bind z copy-mode
bind я copy-mode
bind -n M-z copy-mode
bind -n M-я copy-mode
# Toggle: pressing alt+z while in copy-mode exits it
bind -T copy-mode-vi M-z send -X cancel
bind -T copy-mode-vi M-я send -X cancel

set -g pane-border-lines "double"


set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

set -g mouse on
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send -M" "if -F '#{pane_in_mode}' 'send -M' 'copy-mode -e'"
bind -n WheelDownPane send -M
bind -n PageUp copy-mode -eu
bind -n PageDown send-keys PageDown

set -s escape-time 0

set -g history-limit 2000

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -n M-к source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
# Session switcher: sesh (zoxide-backed) in a centered popup — fzf picks from
# zoxide dirs + running sessions, Enter connects/creates. Needs sesh-bin + fzf.
# On Alt+Space: left thumb + right thumb, the cheapest chord on the board,
# given to the biggest action ("go to a different project entirely"). It also
# absorbs the old M-n new-session prompt — sesh creates by name.
# Raw choose-tree is still on `prefix s`.
# Пикер сессий — Alt+Space. Tab/Shift+Tab листают список — так же, как в
# __fzf_edit_widget на стороне fish, одна привычка на оба пикера.
#
# Тело popup исполняется в `default-shell`, то есть в FISH — в отличие от
# if-shell / run-shell / #(), которые идут через /bin/sh. Синтаксис sh здесь
# падает молча: `-E` закрывает popup сразу, сообщения об ошибке не видно.
#
# Модель sesh: сессия = каталог (он zoxide-backed), имя берётся оттуда, где
# работаешь. Произвольное имя тут не предусмотрено, и прикручивать его к
# пикеру бессмысленно — fzf ищет НЕЧЁТКО, набранное `shit` находит `share/`.
# Для этого отдельный бинд ниже.
bind -n M-Space display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list | fzf --reverse --border none --prompt "sesh> " --bind "tab:down,btab:up")"'

# Новая сессия по имени — Alt+O. command-prompt выполняет команды TMUX, не
# shell, поэтому здесь нет ни fish, ни sh, ни вложенных кавычек.
# `-A`: если сессия с таким именем уже есть — переключиться в неё, а не упасть.
# Кириллическая пара — Alt+Щ: в ЙЦУКЕН это та же физическая клавиша, что `o`
# (Alt+О занят, он пара к Alt+J).
bind -n M-o command-prompt -p "new session:" "new-session -A -s '%%'"
bind -n M-щ command-prompt -p "new session:" "new-session -A -s '%%'"

# Alt+e: yazi in a popup over the current pane. "e" for explorer — free both
# here and in nvim, so no is_vim guard is needed. The popup opens in the pane's
# own directory, and on exit the pane cd's to wherever yazi ended up; `Q`
# inside yazi exits without recording a cwd and leaves the pane put.
#
# The body is __yazi_popup in config.fish — kept there so it reads and tests as
# fish code, and so the shell is named explicitly instead of inheriting
# whatever default-shell the server happened to start with. It works out the
# calling pane on its own; nothing needs passing in.
bind -n M-e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'fish -c __yazi_popup'
bind -n M-у display-popup -E -w 90% -h 90% -d "#{pane_current_path}" 'fish -c __yazi_popup'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ============================================================
# Alt = containers. Same binds on this machine and in VSCode on
# the work Mac — only the program executing them differs.
# See docs/keybinds.md.
#
# Whoever has focus acts: if the pane runs nvim the key is forwarded into it
# (nvim splits share one process — same buffer list, same yank register,
# :diff works). Otherwise tmux does its own thing. Same trick as
# vim-tmux-navigator, applied to splits and close as well as to navigation.
#
# M-t is deliberately NOT bound here: it is nvim's terminal toggle and must
# pass through. The root table is empty (unbind-key -a -T root at the top),
# so anything unbound reaches the pane.
# ============================================================

# Focus
bind -n M-h if -F "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if -F "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if -F "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if -F "$is_vim" 'send-keys M-l' 'select-pane -R'
# Russian (JCUKEN) duplicates: same physical keys with Cyrillic layout active
bind -n M-р if -F "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-о if -F "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-л if -F "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-д if -F "$is_vim" 'send-keys M-l' 'select-pane -R'

# Resize (Alt+Shift+hjkl — was Ctrl+Alt, which is a three-finger reach
# assembled from two corners of the keyboard)
bind -n M-H if -F "$is_vim" 'send-keys M-H' 'resize-pane -L 5'
bind -n M-J if -F "$is_vim" 'send-keys M-J' 'resize-pane -D 3'
bind -n M-K if -F "$is_vim" 'send-keys M-K' 'resize-pane -U 3'
bind -n M-L if -F "$is_vim" 'send-keys M-L' 'resize-pane -R 5'
bind -n M-Р if -F "$is_vim" 'send-keys M-H' 'resize-pane -L 5'
bind -n M-О if -F "$is_vim" 'send-keys M-J' 'resize-pane -D 3'
bind -n M-Л if -F "$is_vim" 'send-keys M-K' 'resize-pane -U 3'
bind -n M-Д if -F "$is_vim" 'send-keys M-L' 'resize-pane -R 5'

# Splits, from vim's own vocabulary (<C-w>v / <C-w>s)
# NOT M-\ or M-[: OSC replies from the terminal end with ST, which on the
# wire is ESC + backslash, and tmux reads any ESC + char in the root table
# as Alt+char — so `bind -n M-\` ate the tail of every reply and yazi died
# on "Terminal response timeout". Same reason to avoid M-] M-P M-O.
bind -n M-v if -F "$is_vim" 'send-keys M-v' 'split-window -h -c "#{pane_current_path}"'
bind -n M-s if -F "$is_vim" 'send-keys M-s' 'split-window -v -c "#{pane_current_path}"'
bind -n M-м if -F "$is_vim" 'send-keys M-v' 'split-window -h -c "#{pane_current_path}"'
bind -n M-ы if -F "$is_vim" 'send-keys M-s' 'split-window -v -c "#{pane_current_path}"'

# Close the focused window/pane. On q, from vim's own `:q` — the same verb
# that closes a window there. Replaces the old pair M-c kill-pane +
# M-q kill-window: killing the last pane closes the window anyway, so one
# bind covers both. M-Q (shift) still kills the whole session.
bind -n M-q if -F "$is_vim" 'send-keys M-q' 'kill-pane'
bind -n M-й if -F "$is_vim" 'send-keys M-q' 'kill-pane'


# Windows
bind -n M-Enter new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-т next-window
bind -n M-з previous-window

# Detach (Alt+d or Prefix+d)
bind -n M-d detach
bind -n M-в detach
bind d detach
bind в detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session
bind -n M-Й confirm-before -p "Kill entire session? (y/n)" kill-session

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"

# Super+C copies here too, so the Mac's Cmd+C gesture works inside copy-mode
# and not just on a mouse selection. It arrives as C-IC because keyd rewrites
# Super+C into Ctrl+Insert (keyd/etc/keyd/default.conf) and kitty forwards it
# on `copy_or_noop` whenever kitty itself has no selection to copy — which,
# with tmux holding the mouse, is always. `y` stays the primary key.
bind -T copy-mode-vi C-IC send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"

# In copy-mode, wheel moves the cursor (so `v` selection extends as you scroll)
# rather than just scrolling the viewport while the cursor stays put.
bind -T copy-mode-vi WheelUpPane   send -X -N 3 cursor-up
bind -T copy-mode-vi WheelDownPane send -X -N 3 cursor-down

# Russian (JCUKEN) duplicates for copy-mode-vi — tmux has no langmap, so each
# vi command needs an explicit Cyrillic binding at the same physical key.
bind -T copy-mode-vi р send -X cursor-left            # h
bind -T copy-mode-vi о send -X cursor-down            # j
bind -T copy-mode-vi л send -X cursor-up              # k
bind -T copy-mode-vi д send -X cursor-right           # l
bind -T copy-mode-vi ц send -X next-word              # w
bind -T copy-mode-vi и send -X previous-word          # b
bind -T copy-mode-vi у send -X next-word-end          # e
bind -T copy-mode-vi Ц send -X next-space             # W
bind -T copy-mode-vi И send -X previous-space         # B
bind -T copy-mode-vi У send -X next-space-end         # E
bind -T copy-mode-vi п send -X -N 1 history-top       # g (gg via repeat works)
bind -T copy-mode-vi П send -X history-bottom         # G
bind -T copy-mode-vi Р send -X top-line               # H
bind -T copy-mode-vi Ь send -X middle-line            # M
bind -T copy-mode-vi Д send -X bottom-line            # L
bind -T copy-mode-vi т send -X search-again           # n
bind -T copy-mode-vi Т send -X search-reverse         # N
bind -T copy-mode-vi м send -X begin-selection        # v
bind -T copy-mode-vi М send -X select-line            # V
bind -T copy-mode-vi н send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"  # y
bind -T copy-mode-vi Н send -X copy-line              # Y
bind -T copy-mode-vi й send -X cancel                 # q
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

# Flexoki Dark — see PALETTE.md
# NOTE: hex colors do NOT render in tmux style options on this setup (even with
# RGB active); only 256-palette colors render. Each colourNNN is the nearest
# xterm-256 index to the Flexoki Dark hex (kept here for reference):
#   1C1B1A→234  878580→102  100F0F→233  8B7EC8→104  403E3C→237  343331→236  CECDC3→251
set -g status-style "bg=colour234,fg=colour102"
set -g status-left  "#[fg=colour233,bg=colour104,bold] #S #[fg=colour102,bg=colour234,nobold] "
set -g status-right "#[fg=colour102]#(cd '#{pane_current_path}' 2>/dev/null && b=$(git symbolic-ref --short HEAD 2>/dev/null) && [ -n \"$b\" ] && echo \" $b\") "
# Каждый тик статус-строки tmux форкает shell на КАЖДЫЙ #() внутри неё.
# Здесь остался ровно один — git-ветка выше (~14 ms). Раньше рядом сидел
# вживлённый continuum (~13 процессов на тик), из-за него интервал и был
# больным местом; теперь цена тика — один процесс, и 15 s это просто
# компромисс между свежестью имени ветки и покоем. 5 s тоже недорого.
set -g status-interval 15
set -g status-left-length 30
set -g status-right-length 60
set -g status-justify left

setw -g window-status-style         "fg=colour102,bg=colour234"
setw -g window-status-current-style "fg=colour233,bg=colour104,bold"
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-activity-style "fg=colour104,bg=colour234"
setw -g window-status-bell-style     "fg=colour251,bg=colour234,bold"

set -g pane-border-style        "fg=colour237"
set -g pane-active-border-style "fg=colour104"
set -g message-style       "fg=colour251,bg=colour236"
set -g message-command-style "fg=colour251,bg=colour236"
set -g mode-style          "fg=colour233,bg=colour104"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# ============================================================
# Session persistence. resurrect does the saving and restoring; WHEN it
# happens is decided here, by hooks.
#
# tmux-continuum was removed. It has no timer of its own, so it injected
# #(continuum_save.sh) into status-right (continuum.tmux:37-42) and woke up
# on every status redraw — ~13 processes every 5 s (bash, tmux -V, three
# `tmux show-option`, date x2, mkdir x2, cut/sed/grep, ps) just to ask
# "has a minute passed?". 179 of every 180 runs answered "no".
# tmux 3.x has hooks, so the save can fire on the events that actually
# change the layout. Idle cost: zero.
#
# `-g` and not `-ag`: -a appends to the hook array, so every Alt+r reload
# would stack another copy and save N times per event. Plain -g overwrites.
#
# window-layout-changed is deliberately NOT here: it also fires on pane
# resize, dozens of times while dragging a border. Cost: a resize made
# right before a reboot isn't saved; it lands on the next window/pane
# change or on detach.
#
# The tail rotates saves — neither resurrect nor continuum ever cleaned up
# (279 files had accumulated). The `last` symlink points at the newest, so it
# always survives.
#
# POSTMORTEM 2026-09-09, first reboot after this was written: the tmux layout
# was LOST. Two mistakes, both fixed above.
#
#   1. session-created was in the hook list. It fires when the server starts
#      with a fresh empty session — i.e. exactly at boot, before the restore
#      below has run. The empty session was saved over `last`, and restore then
#      read that. Hook removed.
#
#   2. Rotation kept 10 files. Hooks fire in bursts (open a window, split,
#      close), so ten files are consumed in a minute of work and the history
#      depth in TIME was near zero — the pre-reboot saves were already gone by
#      the time anyone looked. Now 200 (~100 KB at ~500 B each).
#
# The guard `[ server age > 20s ]` covers the START of a session: no save runs
# while it is still being restored, whatever fires it.
#
# POSTMORTEM 2, the very next reboot: the layout was lost AGAIN, and the guard
# above had nothing to do with it. The mirror-image bug was at SHUTDOWN:
#
#   20:02:58  a hook fired while the server was being torn down; save.sh wrote
#             a ZERO-BYTE file and resurrect pointed `last` at it
#   20:03:01  Reached target System Shutdown
#   20:04:14  boot — restore read `last`, found an empty file, restored nothing
#
# The good save from 19:17 was still on disk and perfectly readable. It was
# simply no longer what `last` pointed to.
#
# Two fixes, both above:
#   - session-closed removed from the hooks. It is the mirror of session-created:
#     it necessarily fires when the last session goes away, i.e. at shutdown,
#     when there is nothing left worth saving.
#   - after every save, an empty `last` is rejected: the zero-byte file is
#     deleted and the symlink is re-pointed at the newest non-empty save. This
#     one does not care WHICH hook misfired, which is why it is the real fix —
#     save.sh writing an empty file instead of failing is the underlying defect,
#     and it is not ours to change.
# ============================================================
rs_save="run -b '[ $(( $(date +%s) - #{start_time} )) -gt 20 ] || exit 0; ~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet; [ -s ~/.local/share/tmux/resurrect/last ] || { rm -f $(readlink ~/.local/share/tmux/resurrect/last 2>/dev/null); ln -sf $(ls -1t ~/.local/share/tmux/resurrect/tmux_resurrect_*.txt 2>/dev/null | head -1) ~/.local/share/tmux/resurrect/last; }; ls -1t ~/.local/share/tmux/resurrect/tmux_resurrect_*.txt 2>/dev/null | tail -n +201 | xargs -r rm --'"

set-hook -g after-new-window     "$rs_save"
set-hook -g after-split-window   "$rs_save"
set-hook -g after-kill-pane      "$rs_save"
set-hook -g after-rename-window  "$rs_save"
set-hook -g after-rename-session "$rs_save"
set-hook -g client-detached      "$rs_save"

run '~/.config/tmux/plugins/tpm/tpm'

# Auto-restore, replacing @continuum-restore. Only on a freshly started
# server: #{start_time} is a raw unix timestamp (run-shell expands formats
# itself, verified), so a server younger than 10 s means "the machine just
# booted", not "Alt+r was pressed". Same restore.sh continuum called, so
# restore speed is unchanged.
# `if`, а не `[ … ] && …`: у второй формы при ложном условии код возврата 1,
# и tmux рапортует это как ошибку команды на каждый Alt+r. `if` с непройденным
# условием возвращает 0 и молчит.
run -b 'if [ "#{start_time}" -gt $(( $(date +%s) - 10 )) ]; then ~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh; fi'
