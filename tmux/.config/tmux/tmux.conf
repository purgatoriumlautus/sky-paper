unbind-key -a -T root

# True color (24-bit). kitty supports it, but tmux must be told explicitly;
# without this, hex theme colors and the copy-mode selection highlight
# (mode-style) degrade and the visual selection is invisible.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Let programs talk to kitty directly (wrapped in tmux's own passthrough
# escape). Without it tmux swallows the capability query yazi sends at
# startup and yazi dies on "Terminal response timeout". "on" (visible pane
# only) is enough; "all" would also let background panes draw over the
# screen.
set -g allow-passthrough on

# Is the focused pane running nvim? Used to decide whether a container bind
# belongs to nvim or to tmux — see "Alt = containers" below.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

# copy-mode = scrollback only. Copying a *command line* is Ctrl+X in fish,
# which takes the commandline buffer instead of screen cells (no `λ ` prompt,
# no padding, no right-prompt clock). See docs/keybinds.md.
bind z copy-mode
bind я copy-mode
bind -n M-u copy-mode
bind -n M-г copy-mode
# Toggle: pressing alt+u while in copy-mode exits it
bind -T copy-mode-vi M-u send -X cancel
bind -T copy-mode-vi M-г send -X cancel

set -g pane-border-lines "double"


set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

set -g mouse on
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send -M" "if -F '#{pane_in_mode}' 'send -M' 'copy-mode -e'"
bind -n WheelDownPane send -M
bind -n PageUp copy-mode -eu
bind -n PageDown send-keys PageDown

set -s escape-time 0

set -g history-limit 2000

bind -n M-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind -n M-к source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
# Session switcher: sesh (zoxide-backed) in a centered popup — fzf picks from
# zoxide dirs + running sessions, Enter connects/creates. Needs sesh-bin + fzf.
# On Alt+Space: left thumb + right thumb, the cheapest chord on the board,
# given to the biggest action ("go to a different project entirely"). It also
# absorbs the old M-n new-session prompt — sesh creates by name.
# Raw choose-tree is still on `prefix s`.
bind -n M-Space display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list | fzf --reverse --border none --prompt "sesh> ")"'

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ============================================================
# Alt = containers. Same binds on this machine and in VSCode on
# the work Mac — only the program executing them differs.
# See docs/keybinds.md.
#
# Whoever has focus acts: if the pane runs nvim the key is forwarded into it
# (nvim splits share one process — same buffer list, same yank register,
# :diff works). Otherwise tmux does its own thing. Same trick as
# vim-tmux-navigator, applied to splits and close as well as to navigation.
#
# M-t is deliberately NOT bound here: it is nvim's terminal toggle and must
# pass through. The root table is empty (unbind-key -a -T root at the top),
# so anything unbound reaches the pane.
# ============================================================

# Focus
bind -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'
# Russian (JCUKEN) duplicates: same physical keys with Cyrillic layout active
bind -n M-р if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind -n M-о if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind -n M-л if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind -n M-д if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'

# Resize (Alt+Shift+hjkl — was Ctrl+Alt, which is a three-finger reach
# assembled from two corners of the keyboard)
bind -n M-H if-shell "$is_vim" 'send-keys M-H' 'resize-pane -L 5'
bind -n M-J if-shell "$is_vim" 'send-keys M-J' 'resize-pane -D 3'
bind -n M-K if-shell "$is_vim" 'send-keys M-K' 'resize-pane -U 3'
bind -n M-L if-shell "$is_vim" 'send-keys M-L' 'resize-pane -R 5'
bind -n M-Р if-shell "$is_vim" 'send-keys M-H' 'resize-pane -L 5'
bind -n M-О if-shell "$is_vim" 'send-keys M-J' 'resize-pane -D 3'
bind -n M-Л if-shell "$is_vim" 'send-keys M-K' 'resize-pane -U 3'
bind -n M-Д if-shell "$is_vim" 'send-keys M-L' 'resize-pane -R 5'

# Splits, from vim's own vocabulary (<C-w>v / <C-w>s)
# NOT M-\ or M-[: OSC replies from the terminal end with ST, which on the
# wire is ESC + backslash, and tmux reads any ESC + char in the root table
# as Alt+char — so `bind -n M-\` ate the tail of every reply and yazi died
# on "Terminal response timeout". Same reason to avoid M-] M-P M-O.
bind -n M-v if-shell "$is_vim" 'send-keys M-v' 'split-window -h -c "#{pane_current_path}"'
bind -n M-s if-shell "$is_vim" 'send-keys M-s' 'split-window -v -c "#{pane_current_path}"'
bind -n M-м if-shell "$is_vim" 'send-keys M-v' 'split-window -h -c "#{pane_current_path}"'
bind -n M-ы if-shell "$is_vim" 'send-keys M-s' 'split-window -v -c "#{pane_current_path}"'

# Close the focused window/pane. On q, from vim's own `:q` — the same verb
# that closes a window there. Replaces the old pair M-c kill-pane +
# M-q kill-window: killing the last pane closes the window anyway, so one
# bind covers both. M-Q (shift) still kills the whole session.
bind -n M-q if-shell "$is_vim" 'send-keys M-q' 'kill-pane'
bind -n M-й if-shell "$is_vim" 'send-keys M-q' 'kill-pane'

# Zoom the pane to full window and back
bind -n M-z resize-pane -Z
bind -n M-я resize-pane -Z

# Windows
bind -n M-Enter new-window -c "#{pane_current_path}"
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-т next-window
bind -n M-з previous-window

# Detach (Alt+d or Prefix+d)
bind -n M-d detach
bind -n M-в detach
bind d detach
bind в detach
bind -n M-Q confirm-before -p "Kill entire session? (y/n)" kill-session
bind -n M-Й confirm-before -p "Kill entire session? (y/n)" kill-session

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"

# Super+C copies here too, so the Mac's Cmd+C gesture works inside copy-mode
# and not just on a mouse selection. It arrives as C-IC because keyd rewrites
# Super+C into Ctrl+Insert (keyd/etc/keyd/default.conf) and kitty forwards it
# on `copy_or_noop` whenever kitty itself has no selection to copy — which,
# with tmux holding the mouse, is always. `y` stays the primary key.
bind -T copy-mode-vi C-IC send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"

# In copy-mode, wheel moves the cursor (so `v` selection extends as you scroll)
# rather than just scrolling the viewport while the cursor stays put.
bind -T copy-mode-vi WheelUpPane   send -X -N 3 cursor-up
bind -T copy-mode-vi WheelDownPane send -X -N 3 cursor-down

# Russian (JCUKEN) duplicates for copy-mode-vi — tmux has no langmap, so each
# vi command needs an explicit Cyrillic binding at the same physical key.
bind -T copy-mode-vi р send -X cursor-left            # h
bind -T copy-mode-vi о send -X cursor-down            # j
bind -T copy-mode-vi л send -X cursor-up              # k
bind -T copy-mode-vi д send -X cursor-right           # l
bind -T copy-mode-vi ц send -X next-word              # w
bind -T copy-mode-vi и send -X previous-word          # b
bind -T copy-mode-vi у send -X next-word-end          # e
bind -T copy-mode-vi Ц send -X next-space             # W
bind -T copy-mode-vi И send -X previous-space         # B
bind -T copy-mode-vi У send -X next-space-end         # E
bind -T copy-mode-vi п send -X -N 1 history-top       # g (gg via repeat works)
bind -T copy-mode-vi П send -X history-bottom         # G
bind -T copy-mode-vi Р send -X top-line               # H
bind -T copy-mode-vi Ь send -X middle-line            # M
bind -T copy-mode-vi Д send -X bottom-line            # L
bind -T copy-mode-vi т send -X search-again           # n
bind -T copy-mode-vi Т send -X search-reverse         # N
bind -T copy-mode-vi м send -X begin-selection        # v
bind -T copy-mode-vi М send -X select-line            # V
bind -T copy-mode-vi н send -X copy-pipe-and-cancel "wl-copy || xclip -in -selection clipboard"  # y
bind -T copy-mode-vi Н send -X copy-line              # Y
bind -T copy-mode-vi й send -X cancel                 # q
bind -n M-/ copy-mode \; command-prompt -p "(search down)" "send -X search-forward '%%%'"
bind -n M-? copy-mode \; command-prompt -p "(search up)"   "send -X search-backward '%%%'"

# Flexoki Dark — see ~/celestia/PALETTE.md
# NOTE: hex colors do NOT render in tmux style options on this setup (even with
# RGB active); only 256-palette colors render. Each colourNNN is the nearest
# xterm-256 index to the Flexoki Dark hex (kept here for reference):
#   1C1B1A→234  878580→102  100F0F→233  8B7EC8→104  403E3C→237  343331→236  CECDC3→251
set -g status-style "bg=colour234,fg=colour102"
set -g status-left  "#[fg=colour233,bg=colour104,bold] #S #[fg=colour102,bg=colour234,nobold] "
set -g status-right "#[fg=colour102]#(cd '#{pane_current_path}' 2>/dev/null && b=$(git symbolic-ref --short HEAD 2>/dev/null) && [ -n \"$b\" ] && echo \" $b\") "
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 60
set -g status-justify left

setw -g window-status-style         "fg=colour102,bg=colour234"
setw -g window-status-current-style "fg=colour233,bg=colour104,bold"
setw -g window-status-format         " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-activity-style "fg=colour104,bg=colour234"
setw -g window-status-bell-style     "fg=colour251,bg=colour234,bold"

set -g pane-border-style        "fg=colour237"
set -g pane-active-border-style "fg=colour104"
set -g message-style       "fg=colour251,bg=colour236"
set -g message-command-style "fg=colour251,bg=colour236"
set -g mode-style          "fg=colour233,bg=colour104"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
run '~/.config/tmux/plugins/tpm/tpm'
